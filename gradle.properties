org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- Fishino app configuration -------------------------------------------
# RDSCo license manager (سامانه مدیریت راهکار دیجیتال شریف). The app asks it
# which server belongs to an employer code.
fishino.directoryUrl=https://api.rahkar-digital.ir/api/v1/
# Product slug of Fishino in the license manager (Products page).
fishino.productSlug=fishino
# Ed25519 public key of the license manager, pinned in the app. Copy
# data.public_key from https://api.rahkar-digital.ir/api/v1/public-key
# (also shown on every license page and on the API docs page). Key id: k20261013-1dd739
fishino.directoryPublicKey=NNxEWNMB6TF9jaS4imXr2zMdbeeH09AjaxrslN3P4HQ=
# GitHub repository (owner/name) whose latest release the app updates from.
# Release builds only; empty disables the in-app updater.
fishino.updateRepo=

name: Release APK

# Builds the APK for every published GitHub release and attaches it to the
# release:
#   - official signing secrets set  -> fishino-x.y.z.apk (rdsco.fishino.app),
#     which installed apps find through the GitHub API and offer as an update;
#   - secrets not set yet            -> fishino-test-x.y.z.apk, a test build
#     (rdsco.fishino.app.test, public test key); installed test builds find
#     it the same way and update themselves.
# Do not mark releases as pre-release: apps only look at the latest release.
#
# Release tags must look like v1.2.3 (minor and patch below 100).
# versionCode = major*10000 + minor*100 + patch, so it always grows.
#
# Official signing (Settings > Secrets and variables > Actions):
#   secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   variables: FISHINO_DIRECTORY_PUBLIC_KEY (optional, overrides gradle.properties)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build, e.g. v1.2.3'
        required: true

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Version from tag
        id: version
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must look like v1.2.3"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must be below 100 (versionCode = major*10000 + minor*100 + patch)"
            exit 1
          fi
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # With the official signing secrets: the real, signed app (in-app
      # updates work). Without them: a test build (rdsco.fishino.app.test,
      # public test key) so every release still carries an installable APK.
      - name: Signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${{ steps.version.outputs.name }}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD is missing."
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "keystore=$RUNNER_TEMP/release.jks"
              echo "variant=Release"
              echo "apk=app/build/outputs/apk/release/app-release.apk"
              echo "file=fishino-$version.apk"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Official signing secrets are not set: attaching a TEST build (fishino-test-$version.apk, package rdsco.fishino.app.test)."
            {
              echo "keystore="
              echo "variant=Preview"
              echo "apk=app/build/outputs/apk/preview/app-preview.apk"
              echo "file=fishino-test-$version.apk"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build APK
        env:
          FISHINO_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          FISHINO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FISHINO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FISHINO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_FROM_VARIABLE: ${{ vars.FISHINO_DIRECTORY_PUBLIC_KEY }}
          VARIANT: ${{ steps.signing.outputs.variant }}
          APK: ${{ steps.signing.outputs.apk }}
        run: |
          args=("-Pfishino.versionName=${{ steps.version.outputs.name }}" "-Pfishino.versionCode=${{ steps.version.outputs.code }}")
          if [ -n "$KEY_FROM_VARIABLE" ]; then
            args+=("-Pfishino.directoryPublicKey=$KEY_FROM_VARIABLE")
          fi
          ./gradlew --no-daemon "test${VARIANT}UnitTest" "assemble${VARIANT}" "${args[@]}"

          if [ ! -f "$APK" ]; then
            echo "::error::$APK was not produced; check the signing secrets."
            exit 1
          fi

      - name: Check signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "${{ steps.signing.outputs.apk }}" | grep -E 'Signer #1 certificate (DN|SHA-256)'

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="${{ steps.signing.outputs.file }}"
          cp "${{ steps.signing.outputs.apk }}" "$file"
          gh release upload "$RELEASE_TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"

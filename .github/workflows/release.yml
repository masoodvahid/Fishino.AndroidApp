name: Release APK

# Builds the signed APK for every published GitHub release and attaches it
# to the release. Installed apps find it through the GitHub API (latest
# release) and offer the update to the user.
#
# Release tags must look like v1.2.3 (minor and patch below 100).
# versionCode = major*10000 + minor*100 + patch, so it always grows.
#
# Repository settings needed (Settings > Secrets and variables > Actions):
#   secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   variables: FISHINO_DIRECTORY_PUBLIC_KEY (unless set in gradle.properties)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build, e.g. v1.2.3'
        required: true

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Version from tag
        id: version
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must look like v1.2.3"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must be below 100 (versionCode = major*10000 + minor*100 + patch)"
            exit 1
          fi
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. See README (نسخه رسمی و بروزرسانی)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        env:
          FISHINO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FISHINO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FISHINO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FISHINO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_FROM_VARIABLE: ${{ vars.FISHINO_DIRECTORY_PUBLIC_KEY }}
        run: |
          args=("-Pfishino.versionName=${{ steps.version.outputs.name }}" "-Pfishino.versionCode=${{ steps.version.outputs.code }}")
          if [ -n "$KEY_FROM_VARIABLE" ]; then
            args+=("-Pfishino.directoryPublicKey=$KEY_FROM_VARIABLE")
          fi
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease "${args[@]}"

          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Signed APK was not produced; check the keystore secrets."
            exit 1
          fi

      - name: Check signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E 'Signer #1 certificate (DN|SHA-256)'

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="fishino-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$file"
          gh release upload "$RELEASE_TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"

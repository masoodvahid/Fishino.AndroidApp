name: Android

on:
  push:
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Compiler and test failures are also emitted as annotations, so they
      # are visible on the run page without opening the log.
      - name: Unit tests
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee gradle-test.log; then
            grep -E -A3 '^\* What went wrong|^e: |FAILED$' gradle-test.log | grep -v '^--$' | head -10 | while IFS= read -r line; do
              echo "::error::${line//$'\r'/}"
            done
            exit 1
          fi

      # R8 and resource shrinking only run in release builds. Build an unsigned
      # one (with a throwaway key, never uploaded) so a broken release build is
      # caught on every push instead of when a release is published.
      - name: Verify release build
        run: ./gradlew --no-daemon assembleRelease "-Pfishino.directoryPublicKey=$(openssl rand -base64 32)"

      # Same test build that releases carry until the official key is set up:
      # fixed public test key, so it installs over the previous one.
      - name: Build test APK
        id: apk
        env:
          KEY_FROM_VARIABLE: ${{ vars.FISHINO_DIRECTORY_PUBLIC_KEY }}
        run: |
          args=()
          if [ -n "$KEY_FROM_VARIABLE" ]; then
            args+=("-Pfishino.directoryPublicKey=$KEY_FROM_VARIABLE")
          elif ! grep -Eq '^fishino\.directoryPublicKey=.+' gradle.properties; then
            echo "::warning::fishino.directoryPublicKey is not set; skipping the APK build."
            exit 0
          fi
          ./gradlew --no-daemon assemblePreview "${args[@]}"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.apk.outputs.built == 'true'
        with:
          name: fishino-test-apk
          path: app/build/outputs/apk/preview/*.apk
          retention-days: 14

name: Android launch

on:
  push:
    branches: [main, fix/release-startup, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      official: ${{ steps.build.outputs.official }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the minified release APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FISHINO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FISHINO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FISHINO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_FROM_VARIABLE: ${{ vars.FISHINO_DIRECTORY_PUBLIC_KEY }}
        run: |
          official=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ -n "$KEYSTORE_BASE64" ]; then
            export FISHINO_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$FISHINO_KEYSTORE_FILE"
            official=true
          else
            # Public test key: PR checks do not need the official signing key.
            export FISHINO_KEYSTORE_FILE="$GITHUB_WORKSPACE/app/test-signing/fishino-test.jks"
            export FISHINO_KEYSTORE_PASSWORD=fishino-test
            export FISHINO_KEY_ALIAS=fishino-test
            export FISHINO_KEY_PASSWORD=fishino-test
          fi
          args=()
          if [ -n "$KEY_FROM_VARIABLE" ]; then
            args+=("-Pfishino.directoryPublicKey=$KEY_FROM_VARIABLE")
          fi
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease "${args[@]}"
          mkdir -p launch-apks
          candidate_version=$(sed -n 's/^fishino.versionName=//p' gradle.properties)
          if [ "$official" = true ]; then
            cp app/build/outputs/apk/release/app-release.apk "launch-apks/fishino-$candidate_version.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk "launch-apks/fishino-smoke-$candidate_version.apk"
          fi
          echo "official=$official" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fishino-startup-apk
          path: launch-apks/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-build-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 7

  launch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: fishino-startup-apk
          path: launch-apks
      - name: Prepare the previously installed official version
        if: needs.build.outputs.official == 'true'
        run: curl -fL --retry 3 'https://github.com/masoodvahid/Fishino.AndroidApp/releases/download/v0.6.2/fishino-0.6.2.apk' -o previous.apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation, cold start, and restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            if [ -f previous.apk ]; then adb install -r previous.apk; fi
            bash scripts/check-startup.sh launch-apks/*.apk rdsco.fishino.app candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-results-api-${{ matrix.api }}
          path: launch-results/
          retention-days: 7

name: Release smoke test

# The release build (R8, resource shrinking) on an emulator: install, open,
# and fail with the de-obfuscated stack trace if the app crashes. Catches
# shrinker problems that unit tests and the debug/test builds cannot.
on:
  push:
    branches: [main, "smoke/**", "fix/**"]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # A throwaway key: only so the APK installs on the emulator.
      - name: Build release APK
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -alias smoke -keyalg RSA -keysize 2048 -validity 1 \
            -storepass smokepass -keypass smokepass -dname "CN=smoke" -noprompt
          FISHINO_KEYSTORE_FILE="$RUNNER_TEMP/smoke.jks" FISHINO_KEYSTORE_PASSWORD=smokepass \
          FISHINO_KEY_ALIAS=smoke FISHINO_KEY_PASSWORD=smokepass \
            ./gradlew --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./scripts/smoke-test.sh app/build/outputs/apk/release/app-release.apk app/build/outputs/mapping/release/mapping.txt
